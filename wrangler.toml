name = "26-ttp-test-bid"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 使用比 allworld 通配符更具体的 zone route，确保本站流量命中独立 Worker
[[routes]]
pattern = "26-ttp-test-bid.softwarelink.net/*"
zone_name = "softwarelink.net"

[[routes]]
pattern = "26-ttp-test-bid.softwarelink.net"
custom_domain = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "Allworld"
database_id = "502e9e5d-e221-480c-a2a8-20c618fe7688"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "26-ttp-test-bid-assets"

[[r2_buckets]]
binding = "SITES"
bucket_name = "allworld-sites"

[vars]
PROJECT_SLUG = "26-ttp-test-bid"
DEPLOYMENT_HOST = "https://26-ttp-test-bid.softwarelink.net/"
ROOT_DOMAIN = "softwarelink.net"
