name = "allworld"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# 共享 allworld：通配子域 R2 多站点；本项目主机走 ASSETS + /api
[[routes]]
pattern = "*.softwarelink.net/*"
zone_name = "softwarelink.net"

[[routes]]
pattern = "26-ttp-test-bid.softwarelink.net"
custom_domain = true

# 保留已有 allworld 自定义域，避免覆盖部署时摘掉其他站点域名
[[routes]]
pattern = "26-sf-dams-bid.softwarelink.net"
custom_domain = true

[[routes]]
pattern = "softwarelink.net"
custom_domain = true

[[routes]]
pattern = "www.softwarelink.net"
custom_domain = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "Allworld"
database_id = "502e9e5d-e221-480c-a2a8-20c618fe7688"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "26-ttp-test-bid-assets"

[[r2_buckets]]
binding = "SITES"
bucket_name = "allworld-sites"

[vars]
PROJECT_SLUG = "26-ttp-test-bid"
DEPLOYMENT_HOST = "https://26-ttp-test-bid.softwarelink.net/"
ROOT_DOMAIN = "softwarelink.net"
